name: CI Gatekeeper & QA Validation

on:
  push:
    branches: [ main, qa, dev ]
  pull_request:
    branches: [ main, qa ]

jobs:
  test-and-validate:
    name: 🧪 Quantitative & MLOps CI
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔐 Validate Environment Variables Structure (Dry-Run)
        run: |
          python scripts/validate_env.py

      - name: 🧠 Verify Graphify Knowledge Graph Integrity
        run: |
          python scripts/update_knowledge_graph.py

      - name: 🧪 Run Unit Tests & Anti-Leakage Suite
        run: |
          pytest tests/ -v

      - name: 📈 Run Gatekeeper Quantitative Stress-Test
        run: |
          python scripts/run_preprod_stress_test.py
