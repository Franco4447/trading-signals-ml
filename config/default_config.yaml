asset:
  symbol: "BTC/USDT"
  exchange: "binance"
  timeframe: "4h"
  history_days: 365

features:
  rolling_windows: [7, 14, 21, 50]
  use_zscore: true
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9

triple_barrier:
  take_profit_atr_mult: 1.5
  stop_loss_atr_mult: 1.0
  vertical_barrier_bars: 12

model:
  type: "lightgbm"
  n_estimators: 200
  learning_rate: 0.03
  max_depth: 6
  random_state: 42

signal_scaler:
  method: "probability_difference" # P(+1) - P(-1)
  min_bound: -1.0
  max_bound: 1.0

backtest:
  taker_fee: 0.00075 # 0.075% fee
  slippage: 0.0002   # 0.02% slippage
  initial_capital: 10000.0
