[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-signals-ml"
version = "0.1.0"
description = "Machine Learning Quantitative Trading Signals Indicator (-1.0 to +1.0)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Franco", email = "franco@example.com" }
]
dependencies = [
    "polars>=0.20.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "optuna>=3.5.0",
    "yfinance>=0.2.35",
    "ccxt>=4.2.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP"]
ignore = ["E501", "PLR"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --import-mode=importlib"
